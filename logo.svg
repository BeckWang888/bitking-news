<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 比特王 logo（依原圖重繪）：十二角星＋鑽石＋字樣 -->
  <defs>
    <rect id="sq" x="38" y="38" width="124" height="124"/>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3940"/><stop offset="1" stop-color="#172126"/>
    </linearGradient>
  </defs>
  <g transform="translate(100 100)">
    <g transform="translate(-100 -100)" fill="url(#bg)" stroke-linejoin="miter">
      <!-- 三個旋轉的方形疊成十二角星，白色邊框交織 -->
      <use href="#sq" transform="rotate(0 100 100)"  stroke="#d9dde0" stroke-width="7"/>
      <use href="#sq" transform="rotate(30 100 100)" stroke="#d9dde0" stroke-width="7"/>
      <use href="#sq" transform="rotate(60 100 100)" stroke="#d9dde0" stroke-width="7"/>
      <use href="#sq" transform="rotate(0 100 100)"  stroke="#1c272c" stroke-width="2.5" fill="none"/>
      <use href="#sq" transform="rotate(30 100 100)" stroke="#1c272c" stroke-width="2.5" fill="none"/>
      <use href="#sq" transform="rotate(60 100 100)" stroke="#1c272c" stroke-width="2.5" fill="none"/>
      <!-- 中間的深色底與內框 -->
      <rect x="44" y="44" width="112" height="112" fill="url(#bg)"/>
      <rect x="50" y="50" width="100" height="100" fill="none" stroke="#e8eaec" stroke-width="2.2"/>
    </g>
    <!-- 鑽石 -->
    <g transform="translate(-100 -100)" stroke="#1c272c" stroke-width="1.6" stroke-linejoin="round">
      <polygon points="80,56 120,56 134,70 100,108 66,70" fill="#f4f5f6"/>
      <polyline points="66,70 134,70" fill="none"/>
      <polyline points="80,56 88,70 100,56 112,70 120,56" fill="none"/>
      <polyline points="88,70 100,108 112,70" fill="none"/>
      <polyline points="76,70 100,108 124,70" fill="none" stroke-width="1"/>
    </g>
    <!-- 字樣 -->
    <text x="0" y="33" text-anchor="middle" fill="#fff" font-size="27" font-weight="900"
      font-family="'Noto Serif TC','Noto Sans TC','Microsoft JhengHei',serif" letter-spacing="2">比特王</text>
    <text x="0" y="45" text-anchor="middle" fill="#fff" font-size="8" font-weight="700"
      font-family="Arial, sans-serif" letter-spacing="1">BIT KING</text>
  </g>
</svg>
