# 比特王新聞網：自動抓新聞並更新網站（GitHub Pages）
# 更新方式：「接力」——每次更新完，等約 13 分鐘自動觸發下一次（約每 15 分鐘一輪）。
# 下面的排程是備用：萬一接力中斷，排程跑起來時會重新接上。
name: 更新新聞並發布網站

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      reports:
        description: "這次最多寫幾則比特王報導（留空＝平常的 10 則）"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 同一時間只發布一次（新的會排在舊的後面，不會互相打架）
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 記住找過的封面圖
        uses: actions/cache@v4
        with:
          path: .cache_images.json
          key: covers-${{ github.run_id }}
          restore-keys: covers-
      - name: 抓取最新新聞
        run: python server.py --once
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_MAX: ${{ inputs.reports }}
      - name: 整理要發布的檔案
        run: |
          mkdir _site
          cp index.html styles.css app.js data.js logo.png news.json community.js firebase-config.js admin.html admin.js admin-posts.js pulse-view.js pulse.json pool.json share.png _site/
          python build_pages.py _site
          # 每次發布加上版本號，讓瀏覽器一定載入最新檔案
          V=${GITHUB_SHA::8}
          sed -i -E "s/(styles\.css|app\.js|data\.js|community\.js|pulse-view\.js)\"/\1?v=$V\"/g" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

  # 接力：等一段時間後觸發下一次更新（就算這次更新失敗也照樣接力）
  next-round:
    needs: build-and-deploy
    if: always()
    runs-on: ubuntu-latest
    # 只保留一條接力：新的一輪開始等待時，舊的等待會被取消
    concurrency:
      group: next-round
      cancel-in-progress: true
    permissions:
      actions: write
    steps:
      - name: 等待約 13 分鐘
        run: sleep 780
      - name: 觸發下一次更新（已經有更新的一輪在跑就不觸發，避免重複）
        run: |
          me=$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json createdAt -q .createdAt)
          newer=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow update-news.yml -L 20 \
                  --json createdAt,status -q "[.[] | select(.createdAt > \"$me\" and .status != \"completed\")] | length")
          if [ "$newer" -gt 0 ]; then
            echo "已經有更新的一輪在進行，這一輪不再接力"
          else
            gh workflow run update-news.yml --repo "$GITHUB_REPOSITORY" --ref main
          fi
        env:
          GH_TOKEN: ${{ github.token }}
